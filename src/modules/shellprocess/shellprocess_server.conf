#
# Apply SSH / VNC / LLM configuration from the server module
#
---
auto: false
script: |
    #!/usr/bin/env bash
    set -euo pipefail

    # Read config from Calamares global storage (set by server QML module)
    # In a real Calamares job, we would read from global storage.
    # For now, this is a placeholder that reads from a JSON file.

    echo "[server] Configuring SSH, VNC, and LLM services..."

    # ── SSH ───────────────────────────────────────────────────
    if [[ "${ssh_enabled:-true}" == "true" ]]; then
        echo "  Enabling SSH on port ${ssh_port:-22}..."
        systemctl enable sshd
        sed -i "s/^Port .*/Port ${ssh_port:-22}/" /etc/ssh/sshd_config

        case "${ssh_auth:-0}" in
            0) echo "  Auth: Password only" ;;
            1) echo "  Auth: Key + Password" ;;
            2)
                echo "  Auth: Key only"
                sed -i 's/^PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
                ;;
        esac
    fi

    # ── VNC ───────────────────────────────────────────────────
    if [[ "${vnc_enabled:-false}" == "true" ]]; then
        echo "  Enabling VNC on port ${vnc_port:-5901}..."
        systemctl enable x11vnc || true
        # Store password
        echo -n "${vnc_password:-changeme}" | x11vnc -storepasswd /etc/vnc/passwd || true
    fi

    # ── LLM ───────────────────────────────────────────────────
    if [[ "${llm_enabled:-false}" == "true" ]]; then
        echo "  Enabling LLM service (${llm_model:-Llama 3.2 8B}) on port ${llm_port:-8080}..."
        # Placeholder — LLM service will be added later
    fi

    echo "[server] Done."
