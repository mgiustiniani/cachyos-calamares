#
# Apply SSH / VNC configuration from the server module
#
---
auto: false
script: |
    #!/usr/bin/env bash
    set -euo pipefail

    echo "[server] Configuring SSH and VNC services..."

    # ── SSH ───────────────────────────────────────────────────
    if [[ "${ssh_enabled:-true}" == "true" ]]; then
        echo "  Enabling SSH on port ${ssh_port:-22}..."

        # Enable and start sshd
        systemctl enable sshd
        systemctl start sshd

        # Configure port
        sed -i "s/^Port .*/Port ${ssh_port:-22}/" /etc/ssh/sshd_config

        # Configure authentication
        case "${ssh_auth:-0}" in
            0) echo "  Auth: Password only" ;;
            1) echo "  Auth: Key + Password" ;;
            2)
                echo "  Auth: Key only"
                sed -i 's/^PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
                ;;
        esac

        # Reload config
        systemctl reload sshd || true
    fi

    # ── VNC (Wayland — wayvnc) ────────────────────────────────
    if [[ "${vnc_enabled:-false}" == "true" ]]; then
        echo "  Enabling VNC on port ${vnc_port:-5901}..."

        # Create wayvnc config
        mkdir -p /etc/wayvnc
        cat > /etc/wayvnc/config <<EOF
        output=0
        port=${vnc_port:-5901}
        password_enabled=true
        password=$(echo -n "${vnc_password:-changeme}" | sha256sum | cut -d' ' -f1)
EOF

        # Create systemd service for wayvnc
        cat > /etc/systemd/system/wayvnc.service <<'SERVEOF'
        [Unit]
        Description=Wayland VNC server
        After=graphical-session.target

        [Service]
        ExecStart=/usr/bin/wayvnc -C /etc/wayvnc/config
        Restart=on-failure
        RestartSec=5

        [Install]
        WantedBy=graphical-session.target
SERVEOF

        systemctl enable wayvnc.service
        systemctl start wayvnc.service || true
    fi

    echo "[server] Done."
