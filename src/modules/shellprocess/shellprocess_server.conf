#
# Apply SSH / VNC configuration from the server module
#
---
auto: false
script: |
    #!/usr/bin/env bash
    set -euo pipefail

    echo "[server] Configuring SSH and VNC services..."

    # String values handed off by the Server QML page through Calamares
    # Global Storage. The importer performs its own read-only USB discovery
    # because the target chroot has a private /run tmpfs.
    xdna_import_enabled='${gs[server_config.xdna_import_enabled]}'
    xdna_eula_accepted='${gs[server_config.xdna_eula_accepted]}'
    xdna_runtime_source='${gs[server_config.xdna_runtime_source]}'
    xdna_license_source='${gs[server_config.xdna_license_source]}'
    xdna_runtime_root='${gs[server_config.xdna_runtime_root]}'
    voice_asr_backend='${gs[server_config.voice_asr_backend]}'
    whisperx_enabled='${gs[server_config.whisperx_enabled]}'
    whisperx_model_mode='${gs[server_config.whisperx_model_mode]}'
    whisperx_model_root='${gs[server_config.whisperx_model_root]}'
    whisperx_language='${gs[server_config.whisperx_language]}'
    whisperx_all_languages='${gs[server_config.whisperx_all_languages]}'
    whisperx_diarization='${gs[server_config.whisperx_diarization]}'
    whisperx_diarization_terms='${gs[server_config.whisperx_diarization_terms]}'
    whisperx_hf_token='${gs[server_config.whisperx_hf_token]}'
    dub_asr_backend='${gs[server_config.dub_asr_backend]}'

    # ── SSH ───────────────────────────────────────────────────
    if [[ "${ssh_enabled:-true}" == "true" ]]; then
        echo "  Enabling SSH on port ${ssh_port:-22}..."

        # Enable and start sshd
        systemctl enable sshd
        systemctl start sshd

        # Configure port
        sed -i "s/^Port .*/Port ${ssh_port:-22}/" /etc/ssh/sshd_config

        # Configure authentication
        case "${ssh_auth:-0}" in
            0) echo "  Auth: Password only" ;;
            1) echo "  Auth: Key + Password" ;;
            2)
                echo "  Auth: Key only"
                sed -i 's/^PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
                ;;
        esac

        # Firewall — allow SSH port
        ufw allow ${ssh_port:-22}/tcp comment 'SSH'

        # Reload config
        systemctl reload sshd || true
    fi

    # ── VNC (Wayland via wayvnc, X11 via x11vnc) ──────────────
    if [[ "${vnc_enabled:-false}" == "true" ]]; then
        echo "  Enabling VNC on port ${vnc_port:-5901}..."

        # Detect display server and configure accordingly
        if command -v wayvnc &>/dev/null; then
            echo "  Detected Wayland — using wayvnc"
            mkdir -p /etc/wayvnc
            cat > /etc/wayvnc/config <<EOF
    output=0
    port=${vnc_port:-5901}
    password_enabled=true
    password=$(echo -n "${vnc_password:-changeme}" | sha256sum | cut -d' ' -f1)
    EOF
            cat > /etc/systemd/system/wayvnc.service <<'SERVEOF'
    [Unit]
    Description=Wayland VNC server
    After=graphical-session.target
    [Service]
    ExecStart=/usr/bin/wayvnc -C /etc/wayvnc/config
    Restart=on-failure
    RestartSec=5
    [Install]
    WantedBy=graphical-session.target
    SERVEOF
            # Firewall — allow VNC port
            ufw allow ${vnc_port:-5901}/tcp comment 'VNC'

            systemctl enable wayvnc.service
            systemctl start wayvnc.service || true
        elif command -v x11vnc &>/dev/null; then
            echo "  Detected X11 — using x11vnc"
            echo -n "${vnc_password:-changeme}" | x11vnc -storepasswd /etc/vnc/passwd || true
            # Firewall — allow VNC port
            ufw allow ${vnc_port:-5901}/tcp comment 'VNC'
            systemctl enable x11vnc || true
        else
            echo "  WARNING: No VNC server found (install wayvnc or x11vnc)"
        fi
    fi

    # ── DS4 LLM / ROCm AI product ───────────────────────────
    if [[ "${llm_enabled:-false}" == "true" ]]; then
        echo "  Installing/enabling DS4 LLM server on port ${llm_port:-8000}..."

        if ! command -v ds4-server &>/dev/null; then
            pacman -S --needed --noconfirm ds4-git || echo "  WARNING: could not install ds4-git"
        fi

        # Determine host based on mode
        if [[ "${llm_mode:-0}" == "1" ]]; then
            LLM_HOST="0.0.0.0"
            echo "  Mode: Remote — listening on all interfaces"
            # Open firewall port for remote access
            ufw allow ${llm_port:-8000}/tcp comment 'DS4-LLM'
        else
            LLM_HOST="127.0.0.1"
            echo "  Mode: Local — listening on localhost only"
        fi

        # Write ds4 config
        mkdir -p /etc/ds4

        # Map model index to actual filename
        case "${llm_model:-0}" in
            0) MODEL_FILE="DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix.gguf" ;;
            1) MODEL_FILE="DeepSeek-V4-Flash-Layers37-42Q4KExperts-OtherExpertLayersIQ2XXSGateUp-Q2KDown-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-fixed.gguf" ;;
            2) MODEL_FILE="DeepSeek-V4-Flash-Q4KExperts-F16HC-F16Compressor-F16Indexer-Q8Attn-Q8Shared-Q8Out-chat-v2-imatrix.gguf" ;;
            *) MODEL_FILE="DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix.gguf" ;;
        esac

        cat > /etc/ds4/config <<CONFIGEOF
    # DS4 configuration — generated by Calamares server module
    MODEL_PATH=/var/lib/ds4/${MODEL_FILE}
    MTP_PATH=/var/lib/ds4/DeepSeek-V4-Flash-MTP-Q4K-Q8_0-F32.gguf
    MTP_DRAFT_TOKENS=2
    BACKEND=rocm
    SERVER_HOST=${LLM_HOST}
    SERVER_PORT=${llm_port:-8000}
    SERVER_CTX=100000
    SERVER_TOKENS=393216
    TEMPERATURE=1.0
    TOP_P=1.0
    MIN_P=0.05
    THINK=high
    CONFIGEOF

        # Enable and start ds4-server service
        systemctl enable ds4-server.service
        systemctl start ds4-server.service || true
    fi

    # ── XDNA2 / gated AMD Ryzen AI SDK import ───────────────
    if [[ "${xdna_import_enabled:-false}" == "true" ]]; then
        if [[ "${xdna_eula_accepted:-false}" != "true" ]]; then
            echo "  ERROR: AMD Ryzen AI import selected without explicit EULA acceptance" >&2
            exit 1
        fi

        echo "  Importing AMD Ryzen AI 1.7.1 from private external media..."
        pacman -S --needed --noconfirm synapse-xdna-runtime

        xdna_source=${xdna_runtime_source:-auto}
        xdna_license=${xdna_license_source:-auto}
        xdna_root=${xdna_runtime_root:-/opt/synapse/xdna/ryzen-ai/1.7.1}

        synapse-xdna-import install \
            --source "$xdna_source" \
            --license "$xdna_license" \
            --target "$xdna_root" \
            --accept-amd-eula

        synapse-xdna doctor
        synapse-xdna onnx-proof --runtime-root "$xdna_root" --json
        echo "  AMD Ryzen AI ONNX runtime imported from USB and NPU inference proven"
    fi

    # ── Voice AI / ROCm audio product ────────────────────────
    if [[ "${voice_enabled:-false}" == "true" ]]; then
        echo "  Configuring Synapse Voice AI on port ${voice_port:-8090}..."

        if ! command -v synapse-voice-api &>/dev/null; then
            pacman -S --needed --noconfirm synapse-voice-ai-rocm || \
                echo "  WARNING: could not install synapse-voice-ai-rocm"
        fi

        if [[ -f /etc/synapse/voice-ai/models.conf ]]; then
            voice_source=${voice_model_source:-auto}
            voice_root=${voice_model_root:-/var/lib/synapse/voice-ai/models}
            voice_mode=external
            [[ "${voice_model_mode:-0}" == "1" ]] && voice_mode=copy
            voice_bind=127.0.0.1
            [[ "${voice_bind_mode:-0}" == "1" ]] && voice_bind=0.0.0.0
            voice_asr=rocm
            [[ "${voice_asr_backend:-0}" == "1" ]] && voice_asr=xdna
            [[ "${voice_asr_backend:-0}" == "2" ]] && voice_asr=cpu

            sed -i \
                -e "s|^VOICE_MODEL_SOURCE=.*|VOICE_MODEL_SOURCE=${voice_source}|" \
                -e "s|^VOICE_MODEL_MODE=.*|VOICE_MODEL_MODE=${voice_mode}|" \
                -e "s|^VOICE_MODEL_ROOT=.*|VOICE_MODEL_ROOT=${voice_root}|" \
                -e "s|^VOICE_LANGUAGE=.*|VOICE_LANGUAGE=${voice_language:-it}|" \
                -e "s|^VOICE_BIND=.*|VOICE_BIND=${voice_bind}|" \
                -e "s|^VOICE_PORT=.*|VOICE_PORT=${voice_port:-8090}|" \
                -e "s|^VOICE_LLM_ENDPOINT=.*|VOICE_LLM_ENDPOINT=${voice_llm_endpoint:-http://192.168.5.157:8000/v1}|" \
                -e "s|^WHISPER_BACKEND=.*|WHISPER_BACKEND=${voice_asr}|" \
                -e "s|^WHISPER_FALLBACK=.*|WHISPER_FALLBACK=rocm,cpu|" \
                /etc/synapse/voice-ai/models.conf

            if [[ "${voice_model_mode:-0}" == "1" ]]; then
                echo "  Downloading Voice AI models from pinned Internet sources..."
                synapse-voice-download-models --root "$voice_root"
            else
                echo "  Validating external Voice AI model archive..."
                if [[ "$voice_source" == "auto" ]]; then
                    synapse-voice-import-models
                else
                    synapse-voice-import-models --source "$voice_source"
                fi
            fi
            systemctl --global enable synapse-voice-api.service || true
        fi

        if [[ "${voice_bind_mode:-0}" == "1" ]] && command -v ufw &>/dev/null; then
            ufw allow "${voice_port:-8090}/tcp" || true
        fi
    fi

    # ── WhisperX / optional ROCm post-processing ─────────────
    if [[ "${whisperx_enabled:-false}" == "true" ]]; then
        echo "  Configuring WhisperX alignment post-processing..."
        pacman -S --needed --noconfirm synapse-whisperx-rocm
        whisperx_root=${whisperx_model_root:-/var/lib/synapse/whisperx/models}
        whisperx_lang=${whisperx_language:-it}
        mkdir -p "$whisperx_root"
        whisperx_terms=no
        [[ "${whisperx_diarization_terms:-false}" == "true" ]] && whisperx_terms=yes
        sed -i \
            -e "s|^MODEL_ROOT=.*|MODEL_ROOT=${whisperx_root}|" \
            -e "s|^DEVICE=.*|DEVICE=rocm|" \
            -e "s|^ACCEPT_DIARIZATION_MODEL_TERMS=.*|ACCEPT_DIARIZATION_MODEL_TERMS=${whisperx_terms}|" \
            /etc/synapse/whisperx/config.conf

        if [[ "${whisperx_model_mode:-0}" == "0" ]]; then
            whisperx_download=(synapse-whisperx download --model-root "$whisperx_root" --device rocm --json)
            if [[ "${whisperx_all_languages:-false}" == "true" ]]; then
                whisperx_download+=(--all-languages)
            else
                whisperx_download+=(--language "$whisperx_lang")
            fi
            if [[ "${whisperx_diarization:-false}" == "true" ]]; then
                if [[ "${whisperx_diarization_terms:-false}" != "true" ]]; then
                    echo "  ERROR: WhisperX diarization selected without accepting the model terms" >&2
                    exit 1
                fi
                whisperx_download+=(--diarization --accept-diarization-terms)
            fi
            HUGGINGFACE_TOKEN="${whisperx_hf_token:-}" "${whisperx_download[@]}"
        else
            echo "  Using existing external WhisperX model directory"
            test -d "$whisperx_root/alignment"
        fi
        chmod -R a+rX "$whisperx_root"
        synapse-whisperx doctor --model-root "$whisperx_root" --device rocm --json
    fi

    # ── Synapse Dub / custom real-video generation ───────────
    if [[ "${dub_enabled:-false}" == "true" ]]; then
        if [[ "${dub_license_accepted:-false}" != "true" ]]; then
            echo "  ERROR: Synapse Dub was selected without accepting the required model licenses" >&2
            exit 1
        fi

        echo "  Installing the complete Synapse Dub runtime..."
        pacman -S --needed --noconfirm synapse-dub

        dub_root=${dub_model_root:-/var/lib/synapse/dub/models}
        dub_asr=openai
        [[ "${dub_asr_backend:-0}" == "1" ]] && dub_asr=xdna
        mkdir -p "$dub_root"
        sed -i \
            -e "s|^MODEL_ROOT=.*|MODEL_ROOT=${dub_root}|" \
            -e "s|^ASR_BACKEND=.*|ASR_BACKEND=${dub_asr}|" \
            -e "s|^ACCEPT_NONCOMMERCIAL_MODEL_LICENSES=.*|ACCEPT_NONCOMMERCIAL_MODEL_LICENSES=yes|" \
            -e "s|^TRANSLATION_ENDPOINT=.*|TRANSLATION_ENDPOINT=${dub_translation_endpoint:-http://192.168.5.157:8000/v1}|" \
            -e "s|^TRANSLATION_MODEL=.*|TRANSLATION_MODEL=${dub_translation_model:-deepseek-v4-flash}|" \
            -e "s|^WAV2LIP_CHECKPOINT=.*|WAV2LIP_CHECKPOINT=${dub_root}/wav2lip/wav2lip_gan.pth|" \
            -e "s|^WAV2LIP_S3FD=.*|WAV2LIP_S3FD=${dub_root}/wav2lip/s3fd.pth|" \
            /etc/synapse/dub/config.conf

        if [[ "${dub_model_mode:-0}" == "0" ]]; then
            echo "  Downloading XTTS-v2 and Wav2Lip models from pinned Internet sources..."
            synapse-dub-models --root "$dub_root" --backend all --accept-noncommercial
        else
            echo "  Validating existing Synapse Dub model directory..."
            test -s "$dub_root/wav2lip/wav2lip_gan.pth"
            test -s "$dub_root/wav2lip/s3fd.pth"
            test -d "$dub_root/coqui/tts/tts_models--multilingual--multi-dataset--xtts_v2"
        fi

        chmod -R a+rX "$dub_root"
        synapse-dub doctor
        echo "  Synapse Dub is installed and ready, including the custom real-video workflow"

        if [[ "${translation_enabled:-false}" == "true" ]]; then
            if [[ "${translation_license_accepted:-false}" != "true" ]]; then
                echo "  ERROR: Specialist translation selected without accepting the SeamlessM4T license" >&2
                exit 1
            fi

            echo "  Installing the specialist SeamlessM4T ROCm translation server..."
            pacman -S --needed --noconfirm synapse-translate-rocm
            translation_root=${translation_model_root:-/var/lib/synapse/translate/models/seamless-m4t-v2-large}
            translation_bind=127.0.0.1
            [[ "${translation_bind_mode:-0}" == "1" ]] && translation_bind=0.0.0.0
            mkdir -p "$translation_root"
            sed -i \
                -e "s|^MODEL_ROOT=.*|MODEL_ROOT=${translation_root}|" \
                -e "s|^BIND=.*|BIND=${translation_bind}|" \
                -e "s|^PORT=.*|PORT=${translation_port:-8091}|" \
                /etc/synapse/translate.conf

            if [[ "${translation_model_mode:-0}" == "0" ]]; then
                echo "  Downloading pinned SeamlessM4T-v2-large models..."
                synapse-translate-models download --root "$translation_root"
            else
                echo "  Importing the existing SeamlessM4T model archive..."
                synapse-translate-models import \
                    --source "${translation_model_source:?Existing translation model source is required}" \
                    --root "$translation_root"
            fi

            grep -q '^IDLE_TIMEOUT=' /etc/synapse/translate.conf || \
                echo 'IDLE_TIMEOUT=120' >> /etc/synapse/translate.conf
            chown -R synapse-translate:synapse-translate "$translation_root"
            chmod -R a+rX "$translation_root"
            synapse-translate-server doctor --model-root "$translation_root"

            # Keep the endpoint available without leaving ROCm/HSA's polling
            # helper at 100% CPU while idle. The socket starts the GPU worker
            # on demand; the worker exits after IDLE_TIMEOUT inactive seconds.
            mkdir -p /etc/systemd/system/synapse-translate.socket.d
            printf '[Socket]\nListenStream=\nListenStream=%s:%s\n' \
                "$translation_bind" "${translation_port:-8091}" \
                > /etc/systemd/system/synapse-translate.socket.d/listen.conf
            systemctl disable --now synapse-translate.service 2>/dev/null || true
            systemctl daemon-reload
            systemctl enable --now synapse-translate.socket
            for _ in $(seq 1 180); do
                curl -fsS --max-time 3 "http://127.0.0.1:${translation_port:-8091}/health" >/dev/null && break
                sleep 5
            done
            curl -fsS --max-time 10 "http://127.0.0.1:${translation_port:-8091}/health" >/dev/null

            grep -q '^TRANSLATION_BACKEND=' /etc/synapse/dub/config.conf || \
                echo 'TRANSLATION_BACKEND=llm' >> /etc/synapse/dub/config.conf
            grep -q '^SPECIALIST_TRANSLATION_ENDPOINT=' /etc/synapse/dub/config.conf || \
                echo 'SPECIALIST_TRANSLATION_ENDPOINT=http://127.0.0.1:8091/v1' >> /etc/synapse/dub/config.conf
            sed -i \
                -e 's|^TRANSLATION_BACKEND=.*|TRANSLATION_BACKEND=specialist|' \
                -e "s|^SPECIALIST_TRANSLATION_ENDPOINT=.*|SPECIALIST_TRANSLATION_ENDPOINT=http://127.0.0.1:${translation_port:-8091}/v1|" \
                /etc/synapse/dub/config.conf

            if [[ "${translation_bind_mode:-0}" == "1" ]] && command -v ufw &>/dev/null; then
                ufw allow "${translation_port:-8091}/tcp" comment 'Synapse-Translate'
            fi
            echo "  Specialist translation server is installed and ready"
        fi

        if [[ "${generative_enabled:-false}" == "true" ]]; then
            echo "  Installing the Wan2.1 VACE ROCm generative visual backend..."
            pacman -S --needed --noconfirm synapse-video-gen-rocm
            generative_root=${generative_model_root:-/var/lib/synapse/video-gen/models/wan-vace-1.3b}
            mkdir -p "$generative_root"
            sed -i "s|^MODEL_ROOT=.*|MODEL_ROOT=${generative_root}|" /etc/synapse/video-gen.conf

            if [[ "${generative_model_mode:-0}" == "0" ]]; then
                echo "  Downloading pinned Apache-2.0 Wan2.1 VACE 1.3B models..."
                synapse-video-gen-models download --root "$generative_root"
            else
                echo "  Validating existing Wan2.1 VACE model directory..."
                synapse-video-gen-models validate --root "$generative_root"
            fi

            chmod -R a+rX "$generative_root"
            synapse-video-gen doctor --model-root "$generative_root"
            echo "  Generative visual production is installed and ready"
        fi
    elif [[ "${generative_enabled:-false}" == "true" || "${translation_enabled:-false}" == "true" ]]; then
        echo "  ERROR: Generative visual production and specialist translation require Synapse Dub" >&2
        exit 1
    fi

    # ── TRELLIS.2 / ROCm AI product ──────────────────────────
    if [[ "${trellis_enabled:-false}" == "true" ]]; then
        echo "  Installing/configuring TRELLIS.2 ROCm..."

        # The Server tab owns model-source configuration before model download.
        # Skip the package post-install downloader here, then run it explicitly
        # after writing /etc/synapse/trellis2-rocm/models.conf.
        TRELLIS2_SKIP_MODEL_DOWNLOAD=1 pacman -S --needed --noconfirm synapse-trellis2-rocm || {
            echo "  WARNING: could not install synapse-trellis2-rocm"
        }

        mkdir -p /etc/synapse/trellis2-rocm
        if [[ -f /etc/synapse/trellis2-rocm/models.conf ]]; then
            MODEL_ROOT="${trellis_model_root:-/var/lib/synapse/trellis2/models}"
            mkdir -p "$MODEL_ROOT"
            sed -i "s|^TRELLIS2_MODEL_ROOT=.*|TRELLIS2_MODEL_ROOT=${MODEL_ROOT}|" /etc/synapse/trellis2-rocm/models.conf || true
            sed -i "s|^HF_HOME=.*|HF_HOME=${MODEL_ROOT}/huggingface|" /etc/synapse/trellis2-rocm/models.conf || true
            sed -i "s|^DINO_MODEL_PATH=.*|DINO_MODEL_PATH=${MODEL_ROOT}/dino/facebook/dinov3-vitl16-pretrain-lvd1689m|" /etc/synapse/trellis2-rocm/models.conf || true
        fi

        if [[ "${trellis_download_models:-true}" == "true" ]]; then
            echo "  Downloading TRELLIS.2 model weights..."
            trellis2-download-models || echo "  WARNING: TRELLIS.2 model download failed; edit /etc/synapse/trellis2-rocm/models.conf and run trellis2-download-models manually"
        else
            echo "  TRELLIS.2 model download skipped by user selection"
        fi
    fi

    echo "[server] Done."
